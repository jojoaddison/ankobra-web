# jacserver's nginx vhost for the quality stack: jojoaddison.local on port 80.
#
#   sudo ln -sfn ~/work/JojoAddisonDev/workspace/ankobra-web/deploy/quality-testing/host-site.conf \
#                /etc/nginx/sites-enabled/jojoaddison.local.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Symlinked from the repository rather than copied, so editing it here edits the live site after a
# reload. A copy in /etc silently drifts from this one. startup.sh prints the command and runs none
# of it — /etc is root-owned and not this repository's to edit.
#
# This stands where ../prod-server/ankobra-web.conf stands on the production server. Unlike the
# microservice stacks on this host there is no second nginx behind it: ankobra-web is a monolith that
# serves its own Angular bundle, so this vhost proxies to the app container directly and there is
# exactly one hop, same as production.
#
# No TLS. A local certificate would be self-signed and every browser would object, and the one thing
# it would exercise — HSTS, includeSubDomains, and the certbot splice — cannot be rehearsed off the
# real domain anyway. That is a genuine gap in what this stack can verify, and it is named in the
# README rather than papered over.

server {
    # Both, and the second line is not redundant.
    #
    # `listen 80` is what makes this reachable from any machine on the LAN, which is the point of
    # running it on jacserver behind a hostname rather than on a laptop. Only the container's
    # published port binds 127.0.0.1; that is what makes this vhost the sole way in.
    #
    # `listen 127.0.0.1:80` covers a case the wildcard alone does not on a shared machine. nginx
    # picks the server block by the most specific listen ADDRESS before it ever looks at
    # server_name, so a sibling block declaring 127.0.0.1:80 owns every connection arriving on
    # loopback and a block declaring only *:80 is not even a candidate. jacserver has such siblings.
    # Without this line, a request to jojoaddison.local FROM jacserver itself — where the name
    # resolves to 127.0.0.1 — is served by whichever other site claimed loopback, which answers 200
    # and renders an Angular app that looks close enough to pass a glance.
    listen 80;
    listen 127.0.0.1:80;
    server_name jojoaddison.local;

    # DELIBERATELY NO add_header HERE, and that is the opposite of the sibling stacks on this host.
    #
    # ankobra-web sets its own security headers in the application (SecurityConfiguration), including
    # a Content-Security-Policy carrying a PER-RESPONSE NONCE that CspNonceFilter mints and
    # SpaWebFilter stamps into the served HTML. A static policy added here would not merely duplicate
    # that — two CSP headers INTERSECT rather than merge, so a fixed `style-src 'self'` from nginx
    # would silently forbid every runtime-injected Angular style that the nonce exists to allow, and
    # the app would render unstyled with nothing in any log to say why.
    #
    # That is precisely the class of failure this stack exists to catch, so it must not be introduced
    # by the stack itself. Production's ankobra-web.conf adds only HSTS for the same reason, and HSTS
    # is meaningless over plain HTTP here.
    #
    # If you are copying this file from a sibling project: delete their add_header block, do not
    # adapt it.

    # Not proxied, matching production. The monitoring network reaches the container directly there;
    # here nothing scrapes it at all. Kept closed so a change that assumes these are unreachable
    # fails on this stack rather than on the server.
    location /management { return 404; }

    client_max_body_size 1m;

    location / {
        # The container's published port. Keep in step with APP_PORT in compose.yml — nginx cannot
        # read the environment, so this number is written twice and startup.sh checks they agree.
        #
        # 18092 rather than the obvious 18090: jacserver is shared, and 18090 is published by
        # hc-professional-quality-service. Pointing this vhost at a port another project owns does not
        # fail — it proxies jojoaddison.local straight into somebody else's application, which answers
        # 200 and looks like a deployment gone strange rather than a port clash. 18080-18086,
        # 18090-18091 and 18100-18103 are all taken there; check with `ss -lntH` before changing this.
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_read_timeout 60s;
    }
}
