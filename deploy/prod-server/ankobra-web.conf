# Deployed as /etc/nginx/sites-available/ankobra-web.conf on the server, symlinked into
# sites-enabled. Named after the app, not the literal domain.
#
# Serves the apex jojoaddison.net + www. This app TOOK THE APEX OVER from the old jojoaddison.conf
# (which still serves the web./portainer./monitoring. subdomains on this host — only the two apex
# server blocks were lifted out of it). One nginx upstream: the JHipster monolith on 127.0.0.1:8090
# serves the marketing site, the public enquiry endpoint and the authenticated portal from one process.
#
# TLS reuses the Let's Encrypt certificate that already covered both names before the takeover — the
# lineage at /etc/letsencrypt/live/www.jojoaddison.net, which covers jojoaddison.net and
# www.jojoaddison.net. `certbot renew` renews that lineage independently and reloads nginx, so this
# conf keeps serving the renewed cert without certbot having to manage this file. That is why the TLS
# block is hand-written here rather than left to `certbot --nginx`: the cert already exists, so a fresh
# issuance would only risk the rate limit.

# Rate-limit zones (SEC-04/SEC-08). These MUST live in the http{} context, so they are included from
# /etc/nginx/conf.d/ankobra-web-limits.conf rather than here — see deploy.sh, which installs both files.
# Keyed on $binary_remote_addr, i.e. per source address only: that is the layer nginx can do cheaply and
# without touching the app. Per-username throttling is the app's job (LoginAttemptService), because
# nginx cannot see which account a request is for without parsing the JSON body.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jojoaddison.net www.jojoaddison.net;

    # Don't advertise the exact nginx build to anyone scanning.
    server_tokens off;

    # Nothing this app accepts is large; the contact form is the only anonymous write path.
    client_max_body_size 1m;

    # HSTS with includeSubDomains, added 2026-08-24 after auditing every *.jojoaddison.net host.
    # There are seven, not the three this comment used to name: docker., kojo., monitoring., ndua.,
    # portainer., web. and dev. The first six all serve valid certificates and already redirect
    # HTTP to HTTPS, so the assertion costs them nothing. dev. is the accepted risk -- it resolves
    # to 46.124.145.61, a machine that is not this server, and answers on neither port; whoever
    # brings it back MUST serve it over HTTPS or browsers that have visited this apex will refuse
    # to reach it. See docs/security-20260805-0936.md section 2.1 and docs/runbook-security.md.
    #
    # Still WITHOUT `preload`. Submitting to the preload list is irreversible on a timescale nobody
    # controls, and it would bind the domain for every browser rather than only for visitors.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/www.jojoaddison.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jojoaddison.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compression. Spring Boot labels the bundles `text/javascript`, so listing only
    # `application/javascript` would silently miss every one of them; and nginx does not compress
    # proxied responses unless told to (gzip_proxied).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Login: the edge half of SEC-04. 5 requests/minute per address, with a small burst so a user
    # fumbling their password twice is not rate-limited. `nodelay` serves the burst immediately rather
    # than queueing it, which would just look like a hang. 429 rather than nginx's default 503, to match
    # what the app returns when its own per-username lockout trips.
    location = /api/authenticate {
        limit_req zone=ankobra_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # HSTS is re-stated in every location that sets any add_header, because nginx DISCARDS all
        # inherited add_header directives from the server block as soon as a location adds one of its
        # own. Silently losing HSTS on these paths is exactly the trap this comment exists to prevent.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Public contact form: anonymous, writes a database row per call (SEC-08). The honeypot in the app
    # catches naive bots; this bounds the damage from one that clears it.
    location = /api/public/enquiries {
        limit_req zone=ankobra_enquiries burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking the JVM.
    # index.html is deliberately not cached — a deploy must be visible immediately.
    location ~* \.(?:js|css|woff2?|svg|ico|png|webmanifest)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $http_host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-stated: this block already had an add_header, so without repeating it the server-level
        # HSTS header would vanish from every JS/CSS/font response.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # /management is not proxied. Health, metrics and Prometheus belong to the monitoring network,
    # which reaches the container directly; not exposing them here is a second, independent reason
    # they never become publicly reachable.
    location /management {
        return 404;
    }

    access_log /var/log/nginx/ankobra-web.access.log;
    error_log /var/log/nginx/ankobra-web.error.log;
}

# HTTP -> HTTPS for the apex and www.
server {
    listen 80;
    listen [::]:80;
    server_name jojoaddison.net www.jojoaddison.net;
    return 301 https://$host$request_uri;
}
