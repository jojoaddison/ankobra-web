# Deployed as /etc/nginx/sites-available/ankobra-web.conf on the server, symlinked into
# sites-enabled. Named after the app, not the literal domain.
#
# Serves the apex jojoaddison.net + www. This app TOOK THE APEX OVER from the old jojoaddison.conf
# (which still serves the web./portainer./monitoring. subdomains on this host — only the two apex
# server blocks were lifted out of it). One nginx upstream: the JHipster monolith on 127.0.0.1:8090
# serves the marketing site, the public enquiry endpoint and the authenticated portal from one process.
#
# TLS reuses the Let's Encrypt certificate that already covered both names before the takeover — the
# lineage at /etc/letsencrypt/live/www.jojoaddison.net, which covers jojoaddison.net and
# www.jojoaddison.net. `certbot renew` renews that lineage independently and reloads nginx, so this
# conf keeps serving the renewed cert without certbot having to manage this file. That is why the TLS
# block is hand-written here rather than left to `certbot --nginx`: the cert already exists, so a fresh
# issuance would only risk the rate limit.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jojoaddison.net www.jojoaddison.net;

    ssl_certificate /etc/letsencrypt/live/www.jojoaddison.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jojoaddison.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compression. Spring Boot labels the bundles `text/javascript`, so listing only
    # `application/javascript` would silently miss every one of them; and nginx does not compress
    # proxied responses unless told to (gzip_proxied).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking the JVM.
    # index.html is deliberately not cached — a deploy must be visible immediately.
    location ~* \.(?:js|css|woff2?|svg|ico|png|webmanifest)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $http_host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /management is not proxied. Health, metrics and Prometheus belong to the monitoring network,
    # which reaches the container directly; not exposing them here is a second, independent reason
    # they never become publicly reachable.
    location /management {
        return 404;
    }

    access_log /var/log/nginx/ankobra-web.access.log;
    error_log /var/log/nginx/ankobra-web.error.log;
}

# HTTP -> HTTPS for the apex and www.
server {
    listen 80;
    listen [::]:80;
    server_name jojoaddison.net www.jojoaddison.net;
    return 301 https://$host$request_uri;
}
