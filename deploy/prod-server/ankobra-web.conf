# Deployed as /etc/nginx/sites-available/ankobra-web.conf on the server, symlinked into
# sites-enabled. Named after the app, not the literal domain.
#
# This is the pre-Certbot bootstrap version — HTTP only. Once DNS points here and this file is
# enabled, run:
#
#   certbot --nginx -d jojoaddison.net -d www.jojoaddison.net
#
# which rewrites this file in place, adding the TLS server block and the HTTP->HTTPS redirect. Do not
# hand-write the TLS block; certbot's rewrite is what keeps renewal working.
#
# This claims the apex jojoaddison.net and www. Claiming an apex is not something to do by accident —
# a server block here takes it over for anything resolving to this host — so confirm no other enabled
# site already serves these names before enabling. www is served by the same block rather than
# redirected, so one certificate covers both.

server {
    listen 80;
    listen [::]:80;
    server_name jojoaddison.net www.jojoaddison.net;

    # Compression. nginx.conf sets `gzip on` globally but leaves `gzip_types` commented out, so only
    # text/html is compressed by default — which would ship the Angular bundle uncompressed. Both
    # settings matter:
    #   gzip_types    — Spring Boot labels the bundles `text/javascript`, so listing only
    #                   `application/javascript` would silently miss every one of them.
    #   gzip_proxied  — this all arrives via proxy_pass, and nginx does not compress proxied
    #                   responses unless told to.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # One upstream. This is a JHipster monolith: the same Spring Boot process serves the Angular
    # bundle, the public enquiry endpoint and the authenticated portal API, so nginx has nothing to
    # fan out.
    location / {
        proxy_pass                          http://127.0.0.1:8090;
        proxy_http_version                  1.1;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Forwarded-Host  $http_host;
        proxy_read_timeout                  60s;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking the JVM.
    # index.html is deliberately not cached here — a deploy must be visible immediately, and it is
    # the file that names the new hashed bundles.
    location ~* \.(?:js|css|woff2?|svg|ico|png|webmanifest)$ {
        proxy_pass                          http://127.0.0.1:8090;
        proxy_set_header  Host              $http_host;
        proxy_cache_valid                   200 1y;
        add_header        Cache-Control     "public, max-age=31536000, immutable";
    }

    # /management is not proxied at all. Health, metrics and the Prometheus endpoint belong to the
    # monitoring network, which reaches the container directly over the shared Docker network. Not
    # exposing them here is a second, independent reason they never become publicly reachable —
    # /management/health is anonymous by design, and the rest requires ROLE_ADMIN.
    location /management {
        return 404;
    }

    access_log /var/log/nginx/ankobra-web.access.log;
    error_log  /var/log/nginx/ankobra-web.error.log;
}
