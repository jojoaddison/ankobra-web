# Deployed as /etc/nginx/sites-available/web-jojoaddison.conf on the server, symlinked into
# sites-enabled.
#
# WHY THIS FILE EXISTS
# --------------------
# web.jojoaddison.net served the previous company site (the `jaweb` JHipster app, container
# `jojoaddison.net` on 127.0.0.1:1976, backed by Mongo). When ankobra-web took over the apex, that
# stack was retired — container removed, image uncached, Mongo stopped — and its content, including
# the /static business cards, moved to the apex app.
#
# The hostname was left behind. On 2026-08-02 the per-subdomain server blocks were split out of
# jojoaddison.conf into <subdomain>-jojoaddison.conf files; monitoring- and portainer- were created,
# web- was not. jojoaddison.conf still refers to "web-/portainer-jojoaddison.conf" in its own comment.
# The result: no server block matched web.jojoaddison.net, so HTTP fell through to another site and
# 404'd, and HTTPS served a certificate for a different name — `curl` failed with
# "no alternative certificate subject name matches target hostname". It was not deliberately taken
# down; it was simply dropped in a refactor, and nothing version-controlled it to catch that.
#
# It lives in this repo now for exactly that reason: this is the config whose only copy was on a
# single host, and it is a redirect INTO this application, so ankobra-web is the right owner.
# `deploy.sh --with-nginx` installs it alongside ankobra-web.conf.
#
# WHY A REDIRECT AND NOT THE OLD SITE
# -----------------------------------
# The old stack is decommissioned and its content is superseded by the apex. A redirect keeps every
# old link, bookmark and printed reference working, restores HTTPS immediately, and serves nothing
# stale. The 533MB Mongo data directory and the slides/static assets are still on the host under
# /var/www/html/01-jojoaddison/prod if the old site is ever wanted back.
#
# TLS reuses the existing Let's Encrypt lineage at /etc/letsencrypt/live/web.jojoaddison.net, which
# covers web.jojoaddison.net and ndua.jojoaddison.net and is valid to 2026-10-30. Certbot renews it
# independently (renew_hook reloads nginx), and ndua.conf already points at the same lineage — so no
# new issuance is needed and the rate limit is not touched.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.jojoaddison.net;

    ssl_certificate /etc/letsencrypt/live/web.jojoaddison.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.jojoaddison.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # HSTS with includeSubDomains, matching ankobra-web.conf as of 2026-08-24 — every
    # *.jojoaddison.net host was audited before this went in; see the comment there for the
    # inventory and the one accepted risk. `always` so it is sent on the 301 as well as on 200s.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # $request_uri keeps the path and query string, so deep links survive the move.
    return 301 https://jojoaddison.net$request_uri;

    access_log /var/log/nginx/web-jojoaddison.access.log;
    error_log /var/log/nginx/web-jojoaddison.error.log;
}

# HTTP -> HTTPS on the same host, so an old http:// link lands on the apex over TLS in one hop to
# https://web... and a second to the apex. Redirecting straight to the apex here would skip the
# chance for the browser to record the HSTS entry for this hostname.
server {
    listen 80;
    listen [::]:80;
    server_name web.jojoaddison.net;
    return 301 https://web.jojoaddison.net$request_uri;
}
