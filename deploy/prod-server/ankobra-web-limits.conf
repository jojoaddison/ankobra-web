# Deployed as /etc/nginx/conf.d/ankobra-web-limits.conf on the server.
#
# Separate from ankobra-web.conf because `limit_req_zone` is only valid in the http{} context, and
# sites-available/*.conf is included inside http{} at the server{} level — putting these directives
# there fails `nginx -t` with "directive is not allowed here". /etc/nginx/conf.d/ IS included directly
# in http{}, so this is where they belong.
#
# Zone names are prefixed per app: this file shares http{} with every other site on the host, and an
# unprefixed `zone=login` would collide the moment a sibling app wants its own login limiter.
#
# Sizing: 10m holds roughly 160k distinct addresses, which is far more than this site will ever see at
# once. The state is per-nginx-worker-shared and resets on reload, which is fine — the app's own
# LoginAttemptService is the layer that needs to remember across a burst.

# SEC-04: brute-force protection at the edge, per source address. 5/min sustained.
limit_req_zone $binary_remote_addr zone=ankobra_login:10m rate=5r/m;

# SEC-08: the anonymous contact form writes a row per call. 3/min is generous for a human filling in a
# form once and far too slow to be worth automating.
limit_req_zone $binary_remote_addr zone=ankobra_enquiries:10m rate=3r/m;
