name: CI

# Build-and-test gate for pull requests and the default branch. Publishing the deployable image is a
# separate concern (.github/workflows/publish.yml) that runs only on main and tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a new push to a PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 25, matching <java.version> in pom.xml and deploy/build.sh. JHipster's maven-enforcer
      # accepts only 21-25, so the runner's default JDK would fail the build before it compiles.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml

      # Backend unit + integration tests. Default profile — the Angular build is not part of this job
      # (the frontend job covers the client); it belongs to -Pprod, which publish.yml runs.
      - name: Verify
        run: ./mvnw -ntp --batch-mode verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` from the committed lockfile; .npmrc pins legacy-peer-deps=true, which npm 10.9's
      # arborist needs to resolve the vitest 4 peer set without crashing (see .npmrc).
      - name: Install
        run: npm ci

      # `npm test` runs pretest -> lint, then vitest.
      - name: Lint + unit tests
        run: npm test

      # The production Angular build enforces bundle/style budgets that the dev build does not
      # (publish.yml's -Pprod is where a budget overrun would otherwise first surface). Run it here
      # so a budget or AOT error fails the PR, not the release.
      - name: Production webapp build
        run: npm run webapp:build:prod

  # G-02 in docs/security-20260805-0936.md. Nothing scanned dependencies before this, which is exactly
  # how three high-severity Angular XSS advisories sat in main undetected until a manual audit.
  #
  # --omit=dev on purpose: this gate covers what ships to a browser. Dev-only advisories (build tooling,
  # test runners) are real but are not user-facing, and failing every PR on them trains people to ignore
  # the gate. Review those with `npm audit` by hand.
  audit:
    name: Dependency audit (shipped deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Fail on high-severity advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Filesystem scan of the Java tree. The backend had no CVE scanning at all, so its exposure was
      # simply unknown. Not pinned to the image because the image is built in publish.yml, which only
      # runs on main — a PR should learn about a vulnerable jar before it merges, not after.
      # Pinned to a tag that exists. This read `@0.28.0`; the tags are `v`-prefixed, so the
      # reference never resolved, "Set up job" failed before any step ran, and THE WHOLE JOB never
      # executed — npm audit included. G-02 was decorative from the day it was added, and CI was red
      # on main for weeks without anyone noticing.
      - name: Scan Java dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
