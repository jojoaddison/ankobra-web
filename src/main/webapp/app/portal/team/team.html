<div class="pview">
  <div class="pview-head">
    <div>
      <h1>Team</h1>
      <p class="sub">The consultants delivering your engagements.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="panel empty">Loading team…</div>
  } @else if (members().length === 0) {
    <div class="panel empty">No team members yet.</div>
  } @else {
    <div class="pgrid pgrid-280">
      @for (m of members(); track m.id) {
        <div class="pcard">
          <div class="pt-person">
            <div class="pt-avatar">{{ m.initials }}</div>
            <div>
              <div class="strong pt-name">{{ m.name }}</div>
              <div class="pt-role">{{ m.role }}</div>
            </div>
          </div>
          <div class="muted pt-qual">{{ m.qualification }}</div>
          @if (m.bio) {
            <p class="pt-bio">{{ m.bio }}</p>
          }
        </div>
      }
    </div>
    <jhi-pager [page]="page()" [pageSize]="pageSize" [totalItems]="total()" (pageChange)="onPage($event)" />
  }
</div>
