<div class="pview">
  <div class="pview-head">
    <div>
      <h1>Team</h1>
      <p class="sub">The consultants delivering your engagements.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="panel empty">Loading team…</div>
  } @else if (members().length === 0) {
    <div class="panel empty">No team members yet.</div>
  } @else {
    <div class="pgrid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))">
      @for (m of members(); track m.id) {
        <div class="pcard">
          <div style="display: flex; align-items: center; gap: 12px">
            <div class="pt-avatar">{{ m.initials }}</div>
            <div>
              <div class="strong" style="font-size: 15px; color: var(--text-primary)">{{ m.name }}</div>
              <div style="font-size: 12.5px; color: var(--brand); font-weight: 650">{{ m.role }}</div>
            </div>
          </div>
          <div class="muted" style="font-size: 12px; margin-top: 10px">{{ m.qualification }}</div>
          @if (m.bio) {
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 10px">{{ m.bio }}</p>
          }
        </div>
      }
    </div>
  }
</div>
