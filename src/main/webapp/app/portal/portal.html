<div class="portal" [class.collapsed]="sidebarCollapsed()">
  <!-- ============ TOP BAR ============ -->
  <header class="app-top">
    <a class="logo" routerLink="/portal/overview">
      <img src="content/images/logo.jpg" alt="Jojo Addison Consultancy" class="logo-wordmark" />
    </a>
    <span class="badge-portal">Client portal</span>
    <button class="icon-btn side-toggle" type="button" aria-label="Toggle menu" (click)="toggleSidebar()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>
    <div class="app-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" />
      </svg>
      <input
        [value]="search()"
        (input)="search.set($any($event.target).value)"
        (keyup.enter)="runSearch(search())"
        placeholder="Search projects, clients, tickets…"
        aria-label="Search"
      />
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" type="button" aria-label="Toggle dark mode" (click)="toggleTheme()">
      @if (theme.theme() === 'light') {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M5 5l1.5 1.5M17.5 17.5L19 19M2 12h2M20 12h2M5 19l1.5-1.5M17.5 6.5L19 5" />
        </svg>
      } @else {
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
      }
    </button>
    <div class="who">
      <div class="av">{{ initials() }}</div>
      <div class="who-txt">
        <div class="who-name">{{ displayName() }}</div>
        <div class="who-role">{{ roleLabel() }}</div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" type="button" routerLink="/">Exit</button>
  </header>

  <div class="app-body">
    <!-- ============ SIDEBAR ============ -->
    <aside class="side">
      @for (grp of nav; track grp.group) {
        <div class="nav-group">
          <div class="nav-group-label">{{ grp.group }}</div>
          @for (item of grp.items; track item.id) {
            <a class="nv" [routerLink]="item.link" routerLinkActive="on" [title]="item.label">
              <span class="nv-ico">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  @switch (item.icon) {
                    @case ('grid') {
                      <rect x="3" y="3" width="7" height="9" rx="1.5" />
                      <rect x="14" y="3" width="7" height="5" rx="1.5" />
                      <rect x="14" y="12" width="7" height="9" rx="1.5" />
                      <rect x="3" y="16" width="7" height="5" rx="1.5" />
                    }
                    @case ('folder') {
                      <path d="M3 7h6l2 2h10v10H3z" />
                    }
                    @case ('users') {
                      <circle cx="9" cy="8" r="3.5" />
                      <path d="M2 20a7 7 0 0114 0" />
                      <path d="M17 11a3 3 0 100-6" />
                      <path d="M18.5 20a6 6 0 00-2-4.5" />
                    }
                    @case ('grid2') {
                      <path d="M4 4h16v5H4zM4 13h7v7H4zM13 13h7v7h-7z" />
                    }
                    @case ('file') {
                      <path d="M6 2h9l5 5v15H6z" />
                      <path d="M15 2v5h5" />
                      <path d="M9 13h7M9 17h5" />
                    }
                    @case ('headset') {
                      <path d="M4 12a8 8 0 0116 0v5a3 3 0 01-3 3h-2" />
                      <rect x="2" y="12" width="4" height="6" rx="1.5" />
                      <rect x="18" y="12" width="4" height="6" rx="1.5" />
                    }
                    @case ('cap') {
                      <path d="M22 9L12 4 2 9l10 5 10-5z" />
                      <path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" />
                    }
                    @case ('user') {
                      <circle cx="12" cy="7" r="3.5" />
                      <path d="M4 21a8 8 0 0116 0" />
                    }
                  }
                </svg>
              </span>
              <span class="nv-label">{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </aside>

    <!-- ============ MAIN VIEW ============ -->
    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
