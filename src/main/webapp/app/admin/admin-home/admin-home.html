<div class="pview admin-home">
  <div class="pview-head">
    <div>
      <h1>Administration</h1>
      <p class="sub">Jump into the client portal or manage the content behind the site.</p>
    </div>
  </div>

  <div class="ah-cards">
    @for (card of cards; track card.link) {
      <a class="pcard ah-card" [routerLink]="card.link">
        <span class="ah-ico">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            @switch (card.icon) {
              @case ('portal') {
                <rect x="3" y="3" width="7" height="9" rx="1.5" />
                <rect x="14" y="3" width="7" height="5" rx="1.5" />
                <rect x="14" y="12" width="7" height="9" rx="1.5" />
                <rect x="3" y="16" width="7" height="5" rx="1.5" />
              }
              @case ('cms') {
                <ellipse cx="12" cy="5" rx="8" ry="3" />
                <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5" />
                <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
              }
            }
          </svg>
        </span>
        <div class="ah-body">
          <h3>{{ card.label }}</h3>
          <p>{{ card.description }}</p>
          <span class="ah-open">Open →</span>
        </div>
      </a>
    }
  </div>

  <div class="ah-tools">
    <div class="ah-tools-label">System</div>
    <div class="ah-tools-row">
      @for (tool of tools; track tool.link) {
        <a class="ah-tool" [routerLink]="tool.link">{{ tool.label }}</a>
      }
    </div>
  </div>
</div>
