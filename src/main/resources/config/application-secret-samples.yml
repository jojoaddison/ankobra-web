# ===================================================================
# Spring Boot configuration for the "secret-samples" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Samples for required secrets to be used in development and ci using prod profile.
# ===================================================================

spring:

jhipster:
  security:
    authentication:
      jwt:
        # SEC-12 in docs/security-20260805-0936.md. This profile is in the `dev` profile group, so this
        # IS the signing key every local run uses — it cannot be an inert placeholder without breaking
        # dev, which is what the audit originally suggested.
        #
        # Instead it decodes to readable ASCII:
        #     DEVELOPMENT-ONLY-SAMPLE-KEY-DO-NOT-USE-IN-PRODUCTION-jojoaddison
        # exactly 64 bytes, the HS512 minimum. Anyone who decodes a key from a config dump, a log or an
        # environment listing sees what it is at a glance, and `grep -r DEVELOPMENT-ONLY` finds it.
        #
        # Belt and braces: SampleSecretGuard refuses to start the application under the prod profile if
        # this value is in use, so pasting it into production fails loudly at boot rather than quietly
        # signing real sessions with a key that is public in git history.
        base64-secret: REVWRUxPUE1FTlQtT05MWS1TQU1QTEUtS0VZLURPLU5PVC1VU0UtSU4tUFJPRFVDVElPTi1qb2pvYWRkaXNvbg==
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    username: jojoaddison
    password:
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    username: jojoaddison
    password:
