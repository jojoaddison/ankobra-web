# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  # Distributed tracing (Spring Boot 4 OpenTelemetry keys). Sampling and the OTLP collector endpoint
  # are env-driven; point OTEL_EXPORTER_OTLP_ENDPOINT at a collector (otel-collector / Tempo / Jaeger).
  tracing:
    sampling:
      probability: ${OTEL_TRACE_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  # The OpenTelemetry starter also brings an OTLP metrics registry and log appender, both on by
  # default. Keep them off: metrics stay on Prometheus (scraped), logs stay on stdout → Alloy → Loki.
  # Only traces go over OTLP.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: jojoaddison
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    filter:
      # SEC-14 in docs/security-20260805-0936.md. `forward` is NOT among Spring Boot's defaults
      # (request, async, error). SpaWebFilter forwards every non-API path to /index.html, and without
      # this the security chain — HeaderWriterFilter included — never runs on that dispatch, so
      # `GET /`, the URL every visitor actually loads, came back with no CSP, no X-Frame-Options and
      # no X-Content-Type-Options while /index.html had all three.
      #
      # Safe to add: SpaWebFilter is a OncePerRequestFilter and will not re-forward, and /index.html
      # is already permitAll, so re-running authorization on the forwarded dispatch decides nothing new.
      #
      # Must live in THIS block, not a second `spring.security:` — a duplicate key in one YAML document
      # makes Spring Boot's strict loader fail the whole context with "found duplicate key".
      dispatcher-types: async,error,forward,request
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: jojoaddison-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: jojoaddison-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'jojoaddisonApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: jojoaddison@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Jojoaddison API
    description: Jojoaddison API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    # SEC-06 in docs/security-20260805-0936.md. Dropped from the generator default:
    #   'unsafe-eval'               — production Angular is AOT-compiled and never evals templates.
    #   https://storage.googleapis.com — a bucket host anyone can publish to, listed as a script source
    #                                    by the generator; nothing in this app loads from it.
    # 'unsafe-inline' remains on script-src and style-src and is the weak point: while it is there, CSP
    # is not a meaningful XSS mitigation. Removing it needs nonces threaded through index.html and the
    # Angular style pipeline, which is a larger change tracked as the rest of SEC-06.
    # SEC-06. `script-src` is now plain 'self' — no 'unsafe-inline', no 'unsafe-eval'. Verified against
    # the built output rather than assumed: 137 production chunks contain zero `eval(` and zero
    # `new Function(`, and the single inline <script> the page carried (a loading-error helper) was moved
    # to content/loading-error.js precisely so this could be dropped. Injected script now has no way to
    # execute, which is the difference between CSP being a control and CSP being decoration.
    #
    # `style-src` keeps 'unsafe-inline' and this is the remaining gap: Angular injects component styles
    # as <style> elements at runtime, so removing it needs per-request nonces (ngCspNonce), which needs
    # index.html to be server-rendered rather than a static asset. Tracked as the rest of SEC-06.
    # It is a much smaller hole than the script one: style injection can deface and can exfiltrate some
    # data through selectors, but it cannot execute code.
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"


