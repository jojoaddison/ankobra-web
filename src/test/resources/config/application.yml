# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: jojoaddison
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson2:
    serialization:
      write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    filter:
      # Mirrors the shipped config (SEC-14). This file shadows the main application.yml on the test
      # classpath, so without repeating it here SpaSecurityHeadersIT would run against Spring Boot's
      # default dispatcher types and pass for the wrong reason. The shipped value is guarded separately
      # by ContentSecurityPolicyConfigTest, which reads the main file from disk.
      dispatcher-types: async,error,forward,request
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: jojoaddison-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: jojoaddison-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'jojoaddisonApp'
  mail:
    from: jojoaddison@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: NTdmMzUxZjdlYjg3NzI5ZWU1ODkyMDgwYmUxZDFjYmFkMTcwNGE3ZGJjYTM3ZDYzYjgyODg0M2JmOWVkYTc4NTNhYzM3Njk5NmU3MjhkZDM2M2VkMGEwYjlmMzcwNzdmZTgxN2FmYTBhNWMzNzY2ZmQ5NmI0NDI5NmYyMjY0ZmU=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  # No telemetry export during tests (no collector). Canonical Boot 4 keys.
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  health:
    mail:
      enabled: false
